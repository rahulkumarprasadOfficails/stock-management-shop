{% extends "panel/base.html" %}
{% block title %}Announcement · Control Panel{% endblock %}
{% block content %}
<a class="text-sm text-indigo-700" href="{% url 'announcements' %}">← Announcements</a><section class="mx-auto mt-3 max-w-2xl rounded-2xl bg-white p-5 shadow-sm sm:p-8"><h1 class="text-2xl font-bold">{% if announcement %}Edit{% else %}Create{% endif %} announcement</h1>
<form method="post" class="mt-5 space-y-4">{% csrf_token %}{% for field in form %}<label class="block text-sm font-medium">{{ field.label }}{{ field }}{% if field.help_text %}<span class="mt-1 block text-xs text-slate-500">{{ field.help_text }}</span>{% endif %}{% for error in field.errors %}<span class="block text-xs text-rose-700">{{ error }}</span>{% endfor %}</label>{% endfor %}<button class="rounded-xl bg-indigo-700 px-4 py-3 font-semibold text-white">Save announcement</button></form></section>
<style>input:not([type=checkbox]),textarea,select{margin-top:.35rem;width:100%;border:1px solid #cbd5e1;border-radius:.6rem;padding:.7rem}select[multiple]{height:10rem}</style>
{% endblock %}
