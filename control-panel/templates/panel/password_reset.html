{% extends "panel/base.html" %}
{% block title %}Temporary password · Control Panel{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl rounded-2xl bg-white p-5 shadow-sm sm:p-8">
  <h1 class="text-2xl font-bold">Password reset complete</h1>
  <p class="mt-2 text-slate-600">{{ profile.user.username }} must change this password at their next sign-in.</p>
  <label for="reset-password" class="mt-5 block text-sm text-slate-600">Temporary password — shown once</label>
  <div class="mt-1 flex gap-2"><input id="reset-password" readonly value="{{ temporary_password }}" class="min-w-0 flex-1 rounded-lg border border-slate-300 px-3 py-3 font-mono"><button type="button" onclick="navigator.clipboard.writeText(document.getElementById('reset-password').value)" class="rounded-lg bg-slate-800 px-4 text-white">Copy</button></div>
  <a class="mt-5 inline-block rounded-xl bg-indigo-700 px-4 py-3 font-semibold text-white" href="{% url 'shop_detail' profile.shop_id %}">Back to shop</a>
</section>
{% endblock %}
