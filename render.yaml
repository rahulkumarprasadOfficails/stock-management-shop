services:
  - type: web
    name: shopsetu
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn shopsetu.wsgi:application"
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "stock-management-shop-shopsetu.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
