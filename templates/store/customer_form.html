{% extends "base.html" %}{% load i18n %}
{% block title %}{{ title }} · ShopSetu{% endblock %}
{% block content %}<section class="panel mx-auto max-w-xl"><h1 class="page-title">{% trans title %}</h1><form method="post" class="mt-5 space-y-4">{% csrf_token %}{% for field in form %}<div><label class="mb-1 block font-medium" for="{{ field.id_for_label }}">{% trans field.label %}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="primary-button">{% trans "Save customer" %}</button></form></section>{% endblock %}
